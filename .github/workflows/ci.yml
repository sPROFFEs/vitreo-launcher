name: Pull request checks

"on":
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vitreo-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Project and publishing tests (no secrets)
        run: |
          python3 scripts/check_project.py
          python3 -m unittest discover -s tests -v
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with:
          gradle-version: '8.11.1'
          cache-read-only: true
      - run: bash scripts/install_sdk.sh
      - name: Debug build, JVM tests, Android lint
        run: bash gradlew --no-daemon --console=plain :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:lintPreview :app:assemblePreview
      - name: Optimized Preview APK (temporary test signature, not a release)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: vitreo-preview-${{ github.sha }}-${{ github.run_attempt }}
          path: app/build/outputs/apk/preview/*.apk
          if-no-files-found: error
          retention-days: 7
      - name: Verification reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: pull-request-reports
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore
          retention-days: 7
