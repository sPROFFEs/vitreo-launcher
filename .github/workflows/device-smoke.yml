name: Emulator smoke tests

"on":
  workflow_call:
    inputs:
      prebuilt:
        type: boolean
        default: false
        description: Use this run's prepared APK artifact instead of compiling again
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    if: ${{ !inputs.prebuilt }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with:
          gradle-version: '8.11.1'
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - run: bash scripts/install_sdk.sh
      - run: bash gradlew --no-daemon --console=plain :app:assembleDebug :app:assembleDebugAndroidTest :app:assemblePreview :uninstallFixture:assembleDebug
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: test-apks-${{ github.sha }}-${{ github.run_id }}
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/androidTest/debug/*.apk
            app/build/outputs/apk/preview/*.apk
            test-fixtures/uninstall-app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
  android:
    needs: build
    if: ${{ !cancelled() && (inputs.prebuilt || needs.build.result == 'success') }}
    strategy:
      fail-fast: false
      matrix:
        api: [31, 35]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: test-apks-${{ github.sha }}-${{ github.run_id }}
          path: .
      - name: Enable hardware virtualization
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Instrumentation and optimized APK launch
        uses: ReactiveCircus/android-emulator-runner@1dcd0090116d15e7c562f8db72807de5e036a4ed
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: python3 scripts/device_smoke.py ${{ matrix.api }}
      - name: Device evidence (including failure logs)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: device-evidence-api-${{ matrix.api }}-${{ github.run_id }}
          overwrite: true
          path: verification/device/api-${{ matrix.api }}/
          if-no-files-found: warn
          retention-days: 14
      - name: Instrumentation reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: instrumentation-api-${{ matrix.api }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          if-no-files-found: ignore
          retention-days: 14
